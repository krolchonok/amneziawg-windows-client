name: Build and Release AmneziaWG Windows Client

on:
  push:
    branches:
      - master
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Cache build dependencies
      uses: actions/cache@v3
      with:
        path: .deps
        key: ${{ runner.os }}-deps-${{ hashFiles('build.bat') }}
        restore-keys: |
          ${{ runner.os }}-deps-

    - name: Build application
      run: .\build.bat

    - name: List build directory
      run: |
        dir
        if (Test-Path amd64) { 
          Write-Host "Contents of amd64:"
          dir amd64 
        } else { 
          Write-Host "amd64 directory not found" 
        }

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: amneziawg-windows-build
        path: |
          amd64/amneziawg.exe
          amd64/awg.exe
          amd64/wintun.dll
        if-no-files-found: error

    - name: Create Release and Upload Assets
      if: github.event_name == 'release'
      run: |
        gh release upload ${{ github.event.release.tag_name }} amd64/amneziawg.exe amd64/awg.exe amd64/wintun.dll --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}