name: Build and Release AmneziaWG Windows Client

on:
  push:
    branches:
      - master
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20.14'

    - name: Cache build dependencies
      uses: actions/cache@v3
      with:
        path: .deps
        key: ${{ runner.os }}-deps-v2-${{ hashFiles('build.bat') }}
        restore-keys: |
          ${{ runner.os }}-deps-v2-

    - name: Install dependencies and build
      run: |
        if exist .deps\prepared (
          echo Dependencies already installed
        ) else (
          echo Installing dependencies
        )
        call build.bat
        if errorlevel 1 exit /b 1
      shell: cmd

    - name: Verify build outputs
      run: |
        Write-Host "Checking build outputs..."
        if (!(Test-Path "amd64\amneziawg.exe")) {
          Write-Host "ERROR: amneziawg.exe not found!"
          Get-ChildItem -Path amd64 -ErrorAction SilentlyContinue | Format-Table
          exit 1
        }
        if (!(Test-Path "amd64\awg.exe")) {
          Write-Host "ERROR: awg.exe not found!"
          exit 1
        }
        if (!(Test-Path "amd64\wintun.dll")) {
          Write-Host "ERROR: wintun.dll not found!"
          exit 1
        }
        if (!(Test-Path "amd64\AmneziaWG-Setup.exe")) {
          Write-Host "ERROR: AmneziaWG-Setup.exe not found!"
          exit 1
        }
        Write-Host "All build outputs verified successfully"
        Get-ChildItem -Path amd64 | Format-Table Name, Length
      shell: pwsh

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: amneziawg-windows-build-${{ github.sha }}
        path: |
          amd64\amneziawg.exe
          amd64\awg.exe
          amd64\wintun.dll
          amd64\AmneziaWG-Setup.exe
        if-no-files-found: error

    - name: Create Release and Upload Assets
      if: github.event_name == 'release'
      run: |
        gh release upload ${{ github.event.release.tag_name }} amd64\amneziawg.exe amd64\awg.exe amd64\wintun.dll amd64\AmneziaWG-Setup.exe --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: pwsh